<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - Transmisie Securizată RISC-V</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/login.js"></script>
</head>
<body>
    <nav>
        <ul id="menuItems">
            <li><a href="index.html">Acasă</a></li>
            <li id="loginMenuItem"><a href="login.html" class="active">Autentificare</a></li>
            <li id="riscvMenuItem" style="display: none;"><a href="riscv.html">RISC-V</a></li>
            <li id="logoutMenuItem" style="display: none;"><a href="#" id="logoutLink">Deconectare</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Autentificare</h1>
        
        <div class="form-container">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nume utilizator</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="Introduceți numele de utilizator"
                    />
                </div>
                
                <div class="form-group">
                    <label for="password">Parolă</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Introduceți parola"
                    />
                </div>
                
                <button type="submit">
                    Autentificare
                </button>
                
                <div id="error" class="error" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Verificare autentificare
            const token = sessionStorage.getItem("token");
            
            if (token) {
                // Redirectionare RISC-V pentru autentificat
                window.location.href = "riscv.html";
                return;
            }

            // Actualizare meniu
            document.getElementById("loginMenuItem").style.display = "block";
            document.getElementById("riscvMenuItem").style.display = "none";
            document.getElementById("logoutMenuItem").style.display = "none";

            if (typeof initLoginForm === "function") {
                initLoginForm();
            } else {
                console.error("initLoginForm nu a fost identificat");
            }
        });
    </script>
</body>
</html>
