<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISC-V - Transmisie Securizată</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/riscv.js"></script>
</head>
<body>
    <nav>
        <ul id="menuItems">
            <li><a href="index.html">Acasă</a></li>
            <li id="loginMenuItem" style="display: none;"><a href="login.html">Autentificare</a></li>
            <li id="riscvMenuItem"><a href="riscv.html" class="active">RISC-V</a></li>
            <li id="logoutMenuItem"><a href="#" id="logoutLink">Deconectare</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Transmisie Instrucțiuni RISC-V</h1>
        
        <h3>Trimite program RISC-V complet</h3>
        <p>Introduceți instrucțiunile RISC-V, câte una pe linie.</p>
        
        <div class="form-group">
            <label for="programSelect">Selectează un program predefinit:</label>
            <select id="programSelect">
                <option value="">-- Selectează un program --</option>
                <option value="program_add_lw">Add & Load Word</option>
                <option value="program_counter">Counter</option>
                <option value="program_functie">Funcție</option>
                <option value="program_mare">Program Mare</option>
                <option value="program_paritate">Paritate</option>
                <option value="program_procedura">Procedură</option>
                <option value="program_sll_xor">SLL & XOR</option>
                <option value="program_stocari_extrageri">Stocări & Extrageri</option>
                <option value="program_suma">Sumă</option>
            </select>
        </div>
        
        <div class="form-group">
            <textarea 
                id="instr" 
                rows="10" 
                cols="50" 
                placeholder="O instrucțiune pe linie. Exemplu:&#10;addi a0, zero, 5&#10;addi a1, zero, 10&#10;add a2, a0, a1"
            ></textarea>
        </div>
        
        <button id="sendBtn">
            Trimite program
        </button>
        
        <p id="status" class="status"></p>
    </div>
    <script>
        // Dictionar cu programe predefinite
        const programs = {
            "program_add_lw": `# Program ADD și LW
addi a0, zero, 5
addi a1, zero, 7
add a2, a0, a1
sw a2, 4(zero)
addi a2, a2, -12
lw a3, 4(zero)
jalr ra, 0(zero)`,
            
            "program_counter": `# Program: Counter
addi t1, zero, 10
addi t2, zero, 1
sub t1, t1, t2
bne t1, zero, -4
jalr ra, 0(zero)`,
            
            "program_functie": `# Program: Functie
addi sp, sp, -32
sd ra, 24(sp)
sd s0, 16(sp)
addi s0, sp, 32
addi a0, zero, 2
auipc x1, 0 
jal x1, 32
sd a0, -24(s0)
addi a5, zero, 0
add a0, zero, a5
ld ra, 24(sp)
ld s0, 16(sp)
addi sp, sp, 32
jal ra, 56
addi sp, sp, -32
sd s0, 24(sp)
addi s0, sp, 32
sd a0, -24(s0)
add a4, zero, a0
add a5, zero, a4
slli a5, a5, 1
add a5, a5, a4
addi a5, a5, 1
add a0, zero, a5
ld s0, 24(sp)
addi sp, sp, 32
jalr ra, 28(zero)
jalr ra, 0(zero)`,
            
            "program_mare": `# Program: Mare
addi ra, zero, 10
addi sp, ra, 20
add gp, ra, sp
sub tp, gp, sp
lui t0, 1
addi t1, zero, 50
and t2, t0, t1
or t3, t2, t0
xor t4, t3, t2
andi t5, t4, 3
ori t6, t5, 6
xori s0, t6, 9
srli s1, s0, 2
sll s2, s1, s1
srl s3, s2, s1
slli s1, s0, 2
sw gp, 0(zero)
lw a0, 0(zero)
slt t0, sp, ra
sltu t1, gp, s1
sra t2, s0, t1
slti a3, s1, 45
sltiu s2, s3, 4
srai a5, a0, 2
sb s3, 4(zero)
sh s0, 8(zero)
sd t3, 12(zero)
lb s9, 4(zero)
lh s7, 8(zero)
lbu t5, 4(zero)
lhu s7, 8(zero)
lwu a0, 0(zero)
ld t3, 12(zero)
jal s7, 8
jalr s10, 140(a5) 
auipc s1, 20
beq sp, gp, 100
bne s1, a0, 4
blt s1, a0, 8
bge gp, a5, 4 
bltu s1, a0, 10
bgeu gp, a5, 4 
jalr ra, 0(zero)
addi zero, zero, 0`,
            
            "program_paritate": `# Program: Verificare paritate
addi a0, zero, 9
andi t0, a0, 1
beq t0, zero, 12
addi t0, zero, 999
jal t1, 8
addi t0, zero, 888
jalr ra, 0(zero)`,
            
            "program_procedura": `# Program: Procedura
auipc ra, 0
jal ra, 12
addi zero, zero, 0
jal ra, 40
addi sp, sp, -4
sw ra, 0(sp)
addi a0, zero, 5
addi a1, zero, 3
addi a0, a0, 2
add a0, a0, a1
lw ra, 0(sp)
addi sp, sp, 4
jalr t0, 0(ra)
addi zero, zero, 0
jalr ra, 0(zero)`,
            
            "program_sll_xor": `# Program: Operatii shift si XOR
addi gp, zero, 10
addi sp, zero, 2
sll t0, gp, sp
xor gp, gp, sp
and t1, t0, gp
xor gp, gp, gp
or t2, zero, sp
xori a0, zero, 4
xor t1, t1, t1  
ori a1, zero, 5 
slli sp, sp, 1  
srli sp, sp, 1  
srai sp, sp, 1  
bge sp, zero, 4
add zero, zero, zero
lui sp, 3 
slti a0, sp, -1 
sltiu a1, sp, -1 
xor sp, sp, sp 
addi tp, zero, -2
slt a3, t0, tp 
sltu a4, t0, tp 
xor tp, tp, tp 
addi a1, zero, 6 
xor t0, t0, t0 
srl a5, a1, a4 
xor a5, a5, a5
xor a4, a4, a4 
sra a1, a1, t2
xor t2, t2, t2
xor a1, a1, a1
jalr ra, 0(zero)`,
            
            "program_stocari_extrageri": `# Program: Store si Load
addi ra, zero, -1 
addi gp, zero, 1
sb ra, 0(zero)
sub ra, ra, gp
sh ra, 4(zero)
sub ra, ra, gp
sd ra, 8(zero)
bltu gp, ra, 8
add zero, zero, zero
bgeu ra, gp, 8
add zero, zero, zero
lb a0, 0(zero)
ld a1, 8(zero)
lh a2, 4(zero)
lbu a3, 15(zero)
lhu a4, 0(zero)
lwu a5, 4(zero)
jalr ra, 0(zero)`,
            
            "program_suma": `# Program: Suma elemente
addi t0, zero, 5
addi t2, zero, 1
add t1, t1, t2
addi t2, t2, 1
blt t2, t0, -8
addi t1, zero, 0
jalr ra, 0(zero)`
        };

        document.addEventListener("DOMContentLoaded", () => {
            const token = sessionStorage.getItem("token");
            //Verificare autentificare
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            // Actualizare meniu
            document.getElementById("loginMenuItem").style.display = "none";
            document.getElementById("riscvMenuItem").style.display = "block";
            document.getElementById("logoutMenuItem").style.display = "block";

            // Logout
            document.getElementById("logoutLink").addEventListener("click", (e) => {
                e.preventDefault();
                sessionStorage.removeItem("token");
                window.location.href = "login.html";
            });

            document.getElementById("programSelect").addEventListener("change", (e) => {
                const programKey = e.target.value;
                const textarea = document.getElementById("instr");
                
                if (programKey && programs[programKey]) {
                    textarea.value = programs[programKey];
                    
                    textarea.style.transition = "all 0.3s ease";
                    textarea.style.borderColor = "var(--led-green)";
                    textarea.style.boxShadow = "0 0 20px rgba(0, 255, 136, 0.3)";
                    
                    setTimeout(() => {
                        textarea.style.borderColor = "";
                        textarea.style.boxShadow = "";
                    }, 1000);
                } else if (programKey === "") {
                    textarea.value = "";
                }
            });

            document.getElementById("sendBtn").addEventListener("click", () => {
                if (typeof sendInstructions === "function") {
                    sendInstructions();
                } else {
                    console.error("sendInstructions nu este definit");
                    const statusEl = document.getElementById("status");
                    statusEl.textContent = "Eroare: Funcția sendInstructions nu este disponibilă";
                    statusEl.className = "status error";
                    statusEl.style.display = "block";
                }
            });
        });
    </script>
</body>
</html>
