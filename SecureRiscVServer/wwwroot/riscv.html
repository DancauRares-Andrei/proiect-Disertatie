<!DOCTYPE html>
<html lang="ro">

    <title>RISC-V</title>

addi a0, zero, 5"></textarea>

        Send program

    <script>
        // Echivalentul lui [Authorize]
        document.addEventListener("DOMContentLoaded", () => {
            const token = sessionStorage.getItem("token");

            if (!token) {
                // nu e autentificat → redirect la login
                window.location.href = "/login.html";
                return;
            }

            // optional: atașăm handlerul JS aici
            document
                .getElementById("sendBtn")
                .addEventListener("click", sendInstructions);
        });
    </script>
